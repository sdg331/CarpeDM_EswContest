[project]
name = "reliefcheck"
version = "0.1.0"
description = "Offline-first embedded relief distribution terminal MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pi = [
  "pyscard>=2.0.10",
  "python-escpos>=3.1",
  "opencv-python-headless>=4.9",
]
dev = []

[project.scripts]
reliefcheck = "reliefcheck.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

